name: Build Flutter APK

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Gerar pasta android/ e outras plataformas
        run: flutter create . --platforms=android --project-name notas_v11 --org {BUNDLE}

      - name: Instalar dependencias
        run: flutter pub get
      - name: Gerar codigo (build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs || true

      - name: Flutter analyze (gate)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/

      - name: Build APK release
        run: flutter build apk --release --split-per-abi

      - name: Encontrar APK
        id: find_apk
        run: |
          APK=$(find build/app/outputs/flutter-apk -name 'app-arm64-v8a-release.apk' -type f | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find build/app/outputs/flutter-apk -name '*.apk' -type f | head -n 1)
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "APK: $APK"

      - name: Criar Release com APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            APK Flutter gerado pelo KATA.
            Build #${{ github.run_number }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          draft: false
          prerelease: false
